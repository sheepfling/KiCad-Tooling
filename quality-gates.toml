schema_version = 1

[files]
include = ["kicad_tooling/**/*.py", "scripts/**/*.py", "tests/**/*.py"]
exclude = []

[checks.runtime_types]
extensions = [".py"]
exclude = ["tests/**/*.py"]

[checks.python_style]
extensions = [".py"]
exclude = ["tests/**/*.py"]
opaque_boundary_paths = []
opaque_boundary_marker_prefix = "# opaque-boundary: "
opaque_boundary_min_reason_chars = 12
forbidden_main_imports = ["main"]

[checks.pydantic_practices]
extensions = [".py"]
exclude = ["tests/**/*.py"]
report_dump_revalidation = true
require_explicit_frozen = false
report_deprecated_v1_apis = true
report_unvalidated_construct = true
report_unvalidated_copy_update = true
report_validator_fallthrough = true
report_field_positional_default = true
report_external_model_docs = false
external_model_names = []

[checks.input_contracts]
extensions = [".py"]
exclude = ["tests/**/*.py"]
report_mutation = true
suggest_read_only = true
sequence_narrowing_paths = []

[checks.test_quality]
extensions = [".py"]
exclude = []
test_paths = ["tests/**/*.py"]

[checks.cyclomatic_complexity]
metric = "cyclomatic"
maximum = 30
severity = "warning"
timeout_seconds = 60

[checks.cyclomatic_complexity.files]
include = ["kicad_tooling/hwrepo/**/*.py"]
exclude = []

[[checks.cyclomatic_complexity.backends]]
language = "python"
backend = "ruff"
version = "0.16.1"

[checks.source_families]
extensions = [".py"]
include = ["kicad_tooling/hwrepo/**/*.py"]
exclude = []
min_family_files = 6
min_prefix_characters = 6
python_import_evidence = true
python_module_roots = ["."]

[checks.shared_utilities]
extensions = [".py"]
exclude = ["scripts/**/*.py", "tests/**/*.py"]
canonical_file_hash_path = "kicad_tooling/hwrepo/evidence.py"
canonical_file_hash_function = "digest"
canonical_git_path = "kicad_tooling/git.py"
minimum_body_statements = 3
minimum_ast_nodes = 8

[[checks.module_roles.modules]]
path = "kicad_tooling/hwrepo/cross_probe.py"
role = "composition"
forbidden_definitions = [
  "build_cross_probe_entry",
  "reconcile_cross_probe_population",
  "admit_cross_probe_inputs",
  "verify_cross_probe_inputs",
]

[[checks.module_roles.modules]]
path = "kicad_tooling/hwrepo/design_lint_candidate_aggregation.py"
role = "composition"
forbidden_definitions = [
  "scan_bus_candidates",
  "scan_component_candidates",
  "scan_component_peer_candidates",
  "scan_connector_candidates",
  "scan_control_candidates",
  "scan_mapped_coverage_candidates",
  "pcb_board_only_footprint_candidates",
  "pcb_component_inventory_candidates",
  "pcb_pad_net_candidates",
  "pcb_required_fitted_reference_candidates",
  "scan_pcb_measurement_candidates",
  "scan_pcb_requirement_candidates",
  "scan_peer_candidates",
  "scan_power_candidates",
  "return_distribution_candidates",
  "schematic_geometry_candidates",
  "stm32_candidates",
]

[[checks.module_roles.modules]]
path = "kicad_tooling/hwrepo/governance_lint.py"
role = "composition"
forbidden_definitions = [
  "capture_governance_lint_filesystem_inputs",
  "evaluate_governance_lint_catalog_policy",
  "evaluate_governance_lint_project_policy",
  "read_governance_lint_shared_inputs",
  "resolve_governance_lint_project_scope",
]

[orchestration]
default_profile = "runtime-types"

[[orchestration.steps]]
kind = "rule"
name = "Python runtime type usage"
rule = "runtime-types"

[[orchestration.profiles]]
name = "runtime-types"
steps = ["Python runtime type usage"]

[[orchestration.steps]]
kind = "rule"
name = "Python style and typing boundaries"
rule = "python-style"

[[orchestration.profiles]]
name = "python-style"
steps = ["Python style and typing boundaries"]

[[orchestration.steps]]
kind = "rule"
name = "Pydantic practices"
rule = "pydantic-practices"

[[orchestration.profiles]]
name = "pydantic-practices"
steps = ["Pydantic practices"]

[[orchestration.steps]]
kind = "rule"
name = "KiCad source-family architecture candidates"
rule = "source-families"

[[orchestration.profiles]]
name = "architecture-candidates"
steps = ["KiCad source-family architecture candidates"]

[[orchestration.steps]]
kind = "rule"
name = "Python input contract review"
rule = "input-contracts"
rollout = "provisional"

[[orchestration.profiles]]
name = "input-contracts"
steps = ["Python input contract review"]

[[orchestration.steps]]
kind = "rule"
name = "KiCad cyclomatic complexity review"
rule = "cyclomatic-complexity"
rollout = "provisional"

[[orchestration.profiles]]
name = "complexity-candidates"
steps = ["KiCad cyclomatic complexity review"]

[[orchestration.steps]]
kind = "rule"
name = "Python test quality review"
rule = "test-quality"
rollout = "provisional"

[[orchestration.profiles]]
name = "test-quality"
steps = ["Python test quality review"]

[[orchestration.steps]]
kind = "rule"
name = "Capability-owner composition boundaries"
rule = "module-roles"
rollout = "mainline"

[[orchestration.profiles]]
name = "module-role-boundaries"
steps = ["Capability-owner composition boundaries"]

[[orchestration.steps]]
kind = "rule"
name = "Shared utility duplication review"
rule = "shared-utilities"
rollout = "mainline"

[[orchestration.profiles]]
name = "shared-utility-duplication"
steps = ["Shared utility duplication review"]
