schema_version = 1

[files]
include = ["kicad_tooling/**/*.py", "scripts/**/*.py"]
exclude = []

[checks.runtime_types]
extensions = [".py"]
exclude = []

[checks.python_style]
extensions = [".py"]
exclude = []
opaque_boundary_paths = []
opaque_boundary_marker_prefix = "# opaque-boundary: "
opaque_boundary_min_reason_chars = 12
forbidden_main_imports = ["main"]

[checks.pydantic_practices]
extensions = [".py"]
exclude = []
report_dump_revalidation = true
require_explicit_frozen = false
report_deprecated_v1_apis = true
report_unvalidated_construct = true
report_unvalidated_copy_update = true
report_validator_fallthrough = true
report_field_positional_default = true
report_external_model_docs = false
external_model_names = []

[checks.input_contracts]
extensions = [".py"]
exclude = []
report_mutation = true
suggest_read_only = true
sequence_narrowing_paths = []

[checks.cyclomatic_complexity]
metric = "cyclomatic"
maximum = 30
severity = "warning"
timeout_seconds = 60

[checks.cyclomatic_complexity.files]
include = ["kicad_tooling/hwrepo/**/*.py"]
exclude = []

[[checks.cyclomatic_complexity.backends]]
language = "python"
backend = "ruff"
version = "0.16.1"

[checks.source_families]
extensions = [".py"]
include = ["kicad_tooling/hwrepo/**/*.py"]
exclude = []
min_family_files = 6
min_prefix_characters = 6
python_import_evidence = true
python_module_roots = ["."]

[orchestration]
default_profile = "runtime-types"

[[orchestration.steps]]
kind = "rule"
name = "Python runtime type usage"
rule = "runtime-types"

[[orchestration.profiles]]
name = "runtime-types"
steps = ["Python runtime type usage"]

[[orchestration.steps]]
kind = "rule"
name = "Python style and typing boundaries"
rule = "python-style"

[[orchestration.profiles]]
name = "python-style"
steps = ["Python style and typing boundaries"]

[[orchestration.steps]]
kind = "rule"
name = "Pydantic practices"
rule = "pydantic-practices"

[[orchestration.profiles]]
name = "pydantic-practices"
steps = ["Pydantic practices"]

[[orchestration.steps]]
kind = "rule"
name = "KiCad source-family architecture candidates"
rule = "source-families"

[[orchestration.profiles]]
name = "architecture-candidates"
steps = ["KiCad source-family architecture candidates"]

[[orchestration.steps]]
kind = "rule"
name = "Python input contract review"
rule = "input-contracts"
rollout = "provisional"

[[orchestration.profiles]]
name = "input-contracts"
steps = ["Python input contract review"]

[[orchestration.steps]]
kind = "rule"
name = "KiCad cyclomatic complexity review"
rule = "cyclomatic-complexity"
rollout = "provisional"

[[orchestration.profiles]]
name = "complexity-candidates"
steps = ["KiCad cyclomatic complexity review"]
