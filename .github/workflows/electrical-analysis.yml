name: Electrical analysis

on:
  workflow_call:
    inputs:
      project_id:
        description: Registered board or schematic with reviewed electrical requirements
        required: true
        type: string

permissions:
  contents: read

jobs:
  electrical:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Install tooling and simulator build prerequisites
        run: |
          python -I -m pip install --disable-pip-version-check -r requirements-tooling.txt
          sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential bison flex
      - name: Run declared electrical requirements with verified simulator setup
        env:
          PROJECT_ID: ${{ inputs.project_id }}
        run: python -I -B -m kicad_tooling.ci_hosted electrical --project "$PROJECT_ID"
      - name: Retain results and failure evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: electrical-analysis-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/electrical/
            build/electrical-charts/
            build/electrical-*.json
            build/ci-hosted/
          if-no-files-found: warn
          retention-days: 30
