name: KiCad tooling acceptance

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  preview-portability:
    name: Preview orchestration (${{ matrix.os }})
    if: >-
      github.event_name != 'push' ||
      github.ref == 'refs/heads/main' ||
      !contains(github.ref_name, 'rc')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Install tooling and test dependencies
        run: python -I -m pip install '.[dev]'
      - name: Exercise portable preview logs and failures
        run: python -I -B -m pytest -q tests/test_hosted_preview.py
  package:
    if: >-
      github.event_name != 'push' ||
      github.ref == 'refs/heads/main' ||
      !contains(github.ref_name, 'rc')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.repository_owner }}/KiCad-Team-Workflow-Template
          ref: 5ca79bedf665a9b6577d96b1d47f13ccd518c968
          path: build/acceptance-template
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Install package check dependencies
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Check tooling and installed wheel against a separate project
        env:
          KICAD_RUN_NATIVE_PCB_FIXTURES: '1'
          KICAD_RUN_NATIVE_CONNECTOR_FIXTURES: '1'
          KICAD_RUN_NATIVE_DB9_RETURN_CONTRACT_FIXTURES: '1'
          KICAD_RUN_NATIVE_MIXED_INTERFACE_RETURN_FIXTURES: '1'
          KICAD_RUN_NATIVE_EMPTY_NETLIST_FIXTURES: '1'
          KICAD_RUN_NATIVE_I2C_PULLUP_FIXTURES: '1'
          KICAD_RUN_NATIVE_I2C_UNCONNECTED_PIN_FIXTURES: '1'
          KICAD_RUN_NATIVE_I2C_PEER_REFERENCE_FIXTURES: '1'
          KICAD_RUN_NATIVE_SPI_PEER_REFERENCE_FIXTURES: '1'
          KICAD_RUN_NATIVE_CAN_TERMINATION_FIXTURES: '1'
          KICAD_RUN_NATIVE_CAN_LINE_POLARITY_FIXTURES: '1'
          KICAD_RUN_NATIVE_ETHERNET_DATA_LABEL_FIXTURES: '1'
          KICAD_RUN_NATIVE_CAN_UNCONNECTED_DIRECTION_PIN_FIXTURES: '1'
          KICAD_RUN_NATIVE_CAN_TX_RX_SAME_NET_FIXTURES: '1'
          KICAD_RUN_NATIVE_CAN_TX_OUTPUT_SHARING_FIXTURES: '1'
          KICAD_RUN_NATIVE_CAN_TX_RX_LABEL_MISMATCH_FIXTURES: '1'
          KICAD_RUN_NATIVE_I2C_SIGNAL_LABEL_FIXTURES: '1'
          KICAD_RUN_NATIVE_I2C_SDA_SCL_SAME_NET_FIXTURES: '1'
          KICAD_RUN_NATIVE_SERIAL_TX_RX_SAME_NET_FIXTURES: '1'
          KICAD_RUN_NATIVE_SERIAL_TX_RX_LABEL_MISMATCH_FIXTURES: '1'
          KICAD_RUN_NATIVE_RS485_DATA_LABEL_MISMATCH_FIXTURES: '1'
          KICAD_RUN_NATIVE_RS485_DATA_SAME_NET_FIXTURES: '1'
          KICAD_RUN_NATIVE_RS485_UNCONNECTED_DATA_PIN_FIXTURES: '1'
          KICAD_RUN_NATIVE_SERIAL_TX_OUTPUT_SHARING_FIXTURES: '1'
          KICAD_RUN_NATIVE_SPI_DATA_POLARITY_FIXTURES: '1'
          KICAD_RUN_NATIVE_SPI_CLOCK_SELECT_LABEL_FIXTURES: '1'
          KICAD_RUN_NATIVE_SPI_BIAS_ARRAY_FIXTURES: '1'
          KICAD_RUN_NATIVE_SPI_SHARED_CHIP_SELECT_FIXTURES: '1'
          KICAD_RUN_NATIVE_SPI_SHARED_DATA_OUTPUT_FIXTURES: '1'
          KICAD_RUN_NATIVE_SPI_DATA_SAME_NET_FIXTURES: '1'
          KICAD_RUN_NATIVE_SPI_CLOCK_CONTROL_SAME_NET_FIXTURES: '1'
          KICAD_RUN_NATIVE_RS485_PEER_REFERENCE_FIXTURES: '1'
          KICAD_RUN_NATIVE_USB_DATA_PATH_FIXTURES: '1'
          KICAD_RUN_NATIVE_USB_DATA_POLARITY_FIXTURES: '1'
          KICAD_RUN_NATIVE_POWER_PATH_FIXTURES: '1'
          KICAD_RUN_NATIVE_LED_RAIL_FIXTURES: '1'
          KICAD_RUN_NATIVE_TWO_PIN_COMPONENT_FIXTURES: '1'
          KICAD_RUN_NATIVE_TRANSFORMER_WINDING_FIXTURES: '1'
          KICAD_RUN_NATIVE_COMPONENT_PEER_PIN_FIXTURES: '1'
          KICAD_RUN_NATIVE_COMPONENT_NAMED_SUPPLY_PIN_FIXTURES: '1'
          KICAD_RUN_NATIVE_COMPONENT_NAMED_RETURN_PIN_FIXTURES: '1'
          KICAD_RUN_NATIVE_COMPONENT_REPEATED_SIGNAL_PIN_FIXTURES: '1'
          KICAD_RUN_NATIVE_COMPONENT_REPEATED_SIGNAL_PIN_UNASSIGNED_FIXTURES: '1'
          KICAD_RUN_NATIVE_COMPONENT_PEER_POWER_INPUT_FIXTURES: '1'
          KICAD_RUN_NATIVE_COMPONENT_RATING_FIXTURES: '1'
          KICAD_RUN_NATIVE_COMPONENT_TERMINAL_ORDER_FIXTURES: '1'
          KICAD_RUN_NATIVE_COMPONENT_BASE_DRIVE_FIXTURES: '1'
          KICAD_RUN_NATIVE_REGULATOR_FEEDBACK_FIXTURES: '1'
          KICAD_RUN_NATIVE_POWER_SEQUENCE_FIXTURES: '1'
          KICAD_RUN_NATIVE_NET_DC_REFERENCE_FIXTURES: '1'
          KICAD_RUN_NATIVE_IC_RAIL_CAPACITOR_FIXTURES: '1'
          KICAD_RUN_NATIVE_POWER_PIN_NET_ROLE_FIXTURES: '1'
          KICAD_RUN_NATIVE_CONTROL_INPUT_FIXTURES: '1'
          KICAD_RUN_NATIVE_DIGITAL_PEER_FIXTURES: '1'
          KICAD_RUN_NATIVE_SERIAL_PEER_FIXTURES: '1'
          KICAD_RUN_NATIVE_SERIAL_UNCONNECTED_PIN_FIXTURES: '1'
          KICAD_RUN_NATIVE_SPI_UNCONNECTED_DATA_FIXTURES: '1'
          KICAD_RUN_NATIVE_CAN_PEER_FIXTURES: '1'
          KICAD_RUN_NATIVE_CAN_PEER_REFERENCE_FIXTURES: '1'
          KICAD_RUN_NATIVE_OPEN_DRAIN_FIXTURES: '1'
          KICAD_RUN_NATIVE_OSCILLATOR_OUTPUT_PATH_FIXTURES: '1'
          KICAD_RUN_NATIVE_STM32_PIN_MAP_FIXTURES: '1'
          KICAD_RUN_NATIVE_USB_C_PORT_FIXTURES: '1'
          KICAD_RUN_NATIVE_SCHEMATIC_GEOMETRY: '1'
          KICAD_RUN_NATIVE_COMPLEMENTARY_PAIR_FIXTURES: '1'
        run: python scripts/ci.py --project-root build/acceptance-template
      - name: Keep stage logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tooling-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/ci/
          if-no-files-found: warn
  prerelease-lint-gate:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, 'rc')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.repository_owner }}/KiCad-Team-Workflow-Template
          ref: 5ca79bedf665a9b6577d96b1d47f13ccd518c968
          path: build/acceptance-template
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Install package check dependencies
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Resolve focused lint scope from annotated tag
        id: lint-scope
        run: python scripts/lint_gate_scope.py --tag "$GITHUB_REF_NAME"
      - name: Check scoped lint gate and installed wheel against separate project
        env:
          PYTEST_MARKEXPR: ${{ steps.lint-scope.outputs.markexpr }}
          PYTEST_PATHS: ${{ steps.lint-scope.outputs.pytestpaths }}
        run: |
          args=(
            --project-root build/acceptance-template
            --pytest-markexpr "$PYTEST_MARKEXPR"
          )
          if [[ -n "${PYTEST_PATHS:-}" ]]; then
            IFS=',' read -r -a pytest_paths <<< "$PYTEST_PATHS"
            args+=(--pytest-paths "${pytest_paths[@]}")
          fi
          python scripts/ci.py "${args[@]}"
      - name: Keep stage logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tooling-lint-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/ci/
          if-no-files-found: warn
